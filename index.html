<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Where is CAE?</title>
  <style>
    body {
      margin: 0;
      background-color: #f0f0f0; /* Change to your desired solid color */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    .question {
      font-size: 2em;
      display: flex;
      align-items: center;
    }

    .magnifier {
      margin-left: 10px;
      font-size: 1.5em;
    }

    .hidden-corner {
      position: absolute;
      top: 5px;
      right: 10px;
      font-size: 0.1em;
      color: #eeeeee;
    }
  </style>
</head>
<body>
  <div class="question">
    Where is CAE?
    <span class="magnifier">🔍</span>
  </div>
  <div class="hidden-corner">CAE - You Found me! Go and let Raquel know </div>
</body>
</html>
