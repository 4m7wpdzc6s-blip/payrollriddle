<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Where is CAE?</title>
  <style>
    body {
      margin: 0;
      background-color: #f0f0f0; /* Change to your desired solid color */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    .question {
      font-size: 2em;
      display: flex;
      align-items: center;
    }

    .magnifier {
      margin-left: 10px;
      font-size: 1.5em;
    }

    .corner-text {
      position: absolute;
      font-size: 0.1em;
      color: #cccccc; /* Medium-light grey */
    }

    .top-right {
      top: 15px;
      right: 20px;
      text-align: right;
      white-space: pre-line;
    }

    .top-left {
      top: 15px;
      left: 20px;
    }

    .bottom-right {
      bottom: 15px;
      right: 20px;
    }

    .bottom-left {
      bottom: 15px;
      left: 20px;
    }
  </style>
</head>
<body>
  <div class="question">
    Where is CAE?
    <span class="magnifier">🔍</span>
  </div>

  <div class="corner-text top-right">
    &gt;CAE - You found me!
    Now go and claim your chocolate&lt;
  </div>
  <div class="corner-text top-left">Not Here</div>
  <div class="corner-text bottom-right">Not Here</div>
  <div class="corner-text bottom-left">Not Here</div>
</body>
</html>
